<div class="project-page">
  <div class="project-reflection">
    <section class="project-section">
      <h2>Assignment overview</h2>
      <p>{{ page.overview | escape }}</p>
    </section>
    <section class="project-section">
      <h2>My approach</h2>
      <p>{{ page.approach | escape }}</p>
    </section>
    <section class="project-section">
      <h2>Revisions made</h2>
      <p>{{ page.revisions | escape }}</p>
    </section>
    <section class="project-section">
      <h2>What I learned</h2>
      <p>{{ page.learning | escape }}</p>
    </section>
  </div>

  <section class="project-document" aria-label="Revised {{ page.title | escape }} document">
    <div class="project-embed">
      <iframe title="Revised {{ page.title | escape }} document" src="{{ page.document_url | escape }}" loading="lazy"></iframe>
    </div>
  </section>
</div>
